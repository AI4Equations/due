seed: 42

dtype: single

data:
    problem_type: sde
    nbursts: 50 # number of (x, dx) bursts sampled per trajectory
    memory: 0 # SDEs are Markovian; only the current state X_t is needed
    multi_steps: 1 # the flow map only defines a single-step transition
    problem_dim: 6 # 3 coupled Van der Pol oscillators = 6D (set to 4 if you regenerate with --n-osc 2)
    dt: 0.01 # Delta t used when the dataset was generated (for plotting)

    # --- batch-runner-specific keys (read by run_experiments.py) ---
    # Generate the .mat files first:  python sde_data_generation/coupled_van_der_pol.py
    train_file: simulated_data/coupled_vdp_6d_train.mat   # path relative to repo root
    test_file: simulated_data/coupled_vdp_6d_test.mat
    train_fraction: 1  # ~200k of 1.0M bursts. CAUTION at dim=6: the neighbor cache
    test_fraction: 1   # 2000 test trajectories; a subset is plenty for the distributional comparison
    max_predict_steps: 0 # 0 = full test horizon (2000 steps); the long rollout is what reveals the attractor

network:
    depth: 2 # multi-D + nonlinear -> a bit more capacity than the 1D examples
    width: 256 # number of neurons
    activation: "gelu"

training:
    device: "cpu" # "cpu", "cuda"
    valid: 0.1
    epochs: 500
    batch_size: 128
    optimizer: "adam"
    scheduler: "cosine" # "cosine", "none", "cyclic_cosine"
    learning_rate: 0.01
    verbose: 10 # print loss every verbose epochs
    loss: "mse"
    save_path: "./sde_diffusion_output" # overridden per-experiment by the runner

diffusion:
    diffusion_timesteps: 300 # K
    ode_solver: "heun" # 2nd-order; beats euler at matched K in benchmarks (see notes)
    tau_schedule: geometric # cluster reverse-ODE nodes near tau=0 where the score sharpens
    tau_min: 1.0e-5 # deepest tau node (~1e-5 sweet spot)
    increment_scale: 20.0 # precondition the small physical increments up toward the O(1) scale of z; TUNE per dataset
    nu: 0.5 # spatial kernel bandwidth (raw units). KEY multi-D knob: distances grow with dimension, so this needs tuning
    chunk_size: 1000 # query-axis batch size for the KD-tree neighbor search
    max_subset_size: 200 # cap on neighbors per target; bounds the cached (N x subset_size) tensors
    subsample_ratio: 1.0 # fraction of D_obs used per score estimate (1.0 = paper's setting)
    cache_latents: false # set true to reuse a previously extracted_latents.pt
    num_threads: 8 # CPU threads for label generation
